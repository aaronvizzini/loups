name: Sync GeoJSON to KML

on:
  schedule:
    - cron: '0 15,22 * * *'
  workflow_dispatch: # Allows you to manually trigger it anytime

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install simplekml requests

      - name: Run Data Conversion
        run: |
          python - << 'EOF'
          import requests
          import simplekml
          import json
          import datetime
          import os

          # Fetch raw CDFW data
          res = requests.get('https://storage.googleapis.com/cdfw-wolf-tracker/wolf_bins.geojson')
          data = res.json()

          kml = simplekml.Kml()

          # Helper to safely extract properties across key casing and null values
          def get_val(props, keys, default='N/A'):
              if not isinstance(props, dict):
                  return default
              for k in keys:
                  for p_k, p_v in props.items():
                      if p_k.lower() == k.lower() and p_v is not None:
                          val_str = str(p_v).strip()
                          if val_str:
                              return val_str
              return default

          for feature in data.get('features', []):
              props = feature.get('properties', {})
              geom = feature.get('geometry', {})
              
              if geom.get('type') == 'Polygon':
                  # Extract properties safely
                  name = get_val(props, ['name', 'pack', 'title', 'id'], default='Unknown Wolf')
                  pack_origin = get_val(props, ['pack_origin', 'pack', 'origin'], default='N/A')
                  date_updated = get_val(props, ['most_recent_adj', 'date', 'updated'], default='N/A')
                  time_of_day = get_val(props, ['time_of_day', 'tod', 'time'], default='both')

                  tod_clean = time_of_day.lower()

                  # Formatted description block
                  desc = (
                      f"Name: {name}\n"
                      f"Pack Origin: {pack_origin}\n"
                      f"Most Recent Adj: {date_updated}\n"
                      f"Time of Day: {time_of_day}"
                  )
                  
                  # Unique name suffix ensures CalTopo displays Day and Night entries separately
                  label_name = f"{name} ({time_of_day.capitalize()})"

                  # GeoJSON [Lon, Lat] -> KML [(Lon, Lat), ...]
                  coords = [tuple(coord[:2]) for coord in geom['coordinates'][0]]
                  poly = kml.newpolygon(name=label_name, description=desc, outerboundaryis=coords)
                  
                  # KML Hex color format: AABBGGRR (Alpha, Blue, Green, Red)
                  # Green: Fill '3300aa00', Line 'ff00aa00'
                  # Purple: Fill '33a000a0', Line 'ffa000a0'
                  if tod_clean == 'day':
                      poly.style.polystyle.color = '3300aa00'  # Green fill
                      poly.style.linestyle.color = 'ff00aa00'  # Green border
                      poly.style.linestyle.width = 3
                  elif tod_clean == 'night':
                      poly.style.polystyle.color = '33a000a0'  # Purple fill
                      poly.style.linestyle.color = 'ffa000a0'  # Purple border
                      poly.style.linestyle.width = 3
                  else:  # 'both' or fallback
                      poly.style.polystyle.color = '3300aa00'  # Green fill
                      poly.style.linestyle.color = 'ffa000a0'  # Purple border
                      poly.style.linestyle.width = 3

                  poly.style.polystyle.fill = 1
                  poly.style.polystyle.outline = 1

          os.makedirs('kmls', exist_ok=True)
          kml.save('w_live.kml')
          kml.save(os.path.join('kmls', datetime.datetime.now().strftime('%m-%d-%Y_%H-%M-%S') + '.kml'))
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add w_live.kml kmls/
          git commit -m "Automated update of wolf tracking data" || exit 0
          git push
