name: Sync GeoJSON to KML

on:
  schedule:
    - cron: '0 15,22 * * *'
  workflow_dispatch: # Allows you to manually trigger it anytime

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install simplekml requests

      - name: Run Data Conversion
        run: |
          python - << 'EOF'
          import requests
          import simplekml
          import json
          import datetime
          import os

          # Fetch the raw CDFW data
          res = requests.get('https://storage.googleapis.com/cdfw-wolf-tracker/wolf_bins.geojson')
          data = res.json()

          kml = simplekml.Kml()

          # KML color format is AABBGGRR (Alpha, Blue, Green, Red)
          COLOR_GREEN_FILL = '3300aa00'    # Semi-transparent green
          COLOR_GREEN_LINE = 'ff00aa00'    # Opaque green
          COLOR_PURPLE_FILL = '33a000a0'   # Semi-transparent purple
          COLOR_PURPLE_LINE = 'ffa000a0'   # Opaque purple

          for feature in data['features']:
              props = feature['properties']
              geom = feature['geometry']
              
              if geom['type'] == 'Polygon':
                  # Extract properties with fallback defaults
                  name = props.get('name', 'Unknown Wolf')
                  pack_origin = props.get('pack_origin', 'Unknown Origin')
                  date_updated = props.get('most_recent_adj', 'N/A')
                  time_of_day = props.get('time_of_day', 'N/A')
                  
                  # Format description text block
                  description_text = (
                      f"Name: {name}\n"
                      f"Pack Origin: {pack_origin}\n"
                      f"Most Recent Adj: {date_updated}\n"
                      f"Time of Day: {time_of_day}"
                  )

                  # SimpleKML expects [(Lon, Lat), ...] coordinates
                  coords = [tuple(coord) for coord in geom['coordinates'][0]]
                  poly = kml.newpolygon(
                      name=name,
                      description=description_text,
                      outerboundaryis=coords
                  )
                  
                  # Apply styles based on time_of_day value
                  if time_of_day == 'day':
                      # Green fill with green border
                      poly.style.polystyle.color = COLOR_GREEN_FILL
                      poly.style.linestyle.color = COLOR_GREEN_LINE
                      poly.style.linestyle.width = 2
                  elif time_of_day == 'night':
                      # Purple fill with purple border
                      poly.style.polystyle.color = COLOR_PURPLE_FILL
                      poly.style.linestyle.color = COLOR_PURPLE_LINE
                      poly.style.linestyle.width = 2
                  elif time_of_day == 'both':
                      # Green fill with purple border
                      poly.style.polystyle.color = COLOR_GREEN_FILL
                      poly.style.linestyle.color = COLOR_PURPLE_LINE
                      poly.style.linestyle.width = 3

          os.makedirs('kmls', exist_ok=True)
          kml.save('w_live.kml')
          kml.save(os.path.join('kmls', datetime.datetime.now().strftime('%m-%d-%Y_%H-%M-%S') + '.kml'))
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add w_live.kml kmls/
          git commit -m "Automated update of wolf tracking data" || exit 0
          git push
