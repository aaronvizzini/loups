name: Sync GeoJSON to KML

on:
  schedule:
    - cron: '0 15,22 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install simplekml requests

      - name: Run Data Conversion
        run: |
          python - << 'EOF'
          import requests
          import simplekml
          import json
          import datetime
          import os

          # Fetch raw CDFW data
          res = requests.get('https://storage.googleapis.com/cdfw-wolf-tracker/wolf_bins.geojson')
          data = res.json()

          kml = simplekml.Kml()

          # Folder structure for CalTopo / Google Earth layer toggling
          folder_day = kml.newfolder(name="Day Range")
          folder_night = kml.newfolder(name="Night Range")
          folder_both = kml.newfolder(name="Both / Combined")

          for feature in data.get('features', []):
              props = feature.get('properties', {})
              geom = feature.get('geometry', {})
              geom_type = geom.get('type')

              # Direct key extractions from GeoJSON schema
              name = props.get('name', 'Unknown Wolf')
              pack_origin = props.get('pack_origin', 'N/A')
              date_updated = props.get('most_recent_adj', 'N/A')
              time_of_day = props.get('time_of_day', 'both')

              tod_clean = str(time_of_day).strip().lower()

              desc = (
                  f"Name: {name}\n"
                  f"Pack Origin: {pack_origin}\n"
                  f"Most Recent Adj: {date_updated}\n"
                  f"Time of Day: {time_of_day}"
              )

              label_name = f"{name} ({str(time_of_day).capitalize()})"

              # Assign target folder layer
              if tod_clean == 'day':
                  target_folder = folder_day
              elif tod_clean == 'night':
                  target_folder = folder_night
              else:
                  target_folder = folder_both

              # Normalize geometry rings across Polygon and MultiPolygon
              rings = []
              if geom_type == 'Polygon' and geom.get('coordinates'):
                  rings = [geom['coordinates'][0]]
              elif geom_type == 'MultiPolygon' and geom.get('coordinates'):
                  rings = [p[0] for p in geom['coordinates']]

              for ring in rings:
                  coords = [(coord[0], coord[1]) for coord in ring]
                  poly = target_folder.newpolygon(name=label_name, description=desc, outerboundaryis=coords)
                  
                  # KML Hex color format: AABBGGRR
                  if tod_clean == 'day':
                      poly.style.polystyle.color = '3300aa00'  # Green fill
                      poly.style.linestyle.color = 'ff00aa00'  # Green border
                  elif tod_clean == 'night':
                      poly.style.polystyle.color = '33a000a0'  # Purple fill
                      poly.style.linestyle.color = 'ffa000a0'  # Purple border
                  else:
                      poly.style.polystyle.color = '3300aa00'  # Green fill
                      poly.style.linestyle.color = 'ffa000a0'  # Purple border

                  poly.style.linestyle.width = 3
                  poly.style.polystyle.fill = 1
                  poly.style.polystyle.outline = 1

          os.makedirs('kmls', exist_ok=True)
          kml.save('w_live.kml')
          kml.save(os.path.join('kmls', datetime.datetime.now().strftime('%m-%d-%Y_%H-%M-%S') + '.kml'))
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add w_live.kml kmls/
          git commit -m "Automated update of wolf tracking data" || exit 0
          git push
