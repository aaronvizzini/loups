name: Sync GeoJSON to KML

on:
  schedule:
    - cron: '0 15,22 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install simplekml requests

      - name: Run Data Conversion
        run: |
          python - << 'EOF'
          import requests
          import simplekml
          import datetime
          import os

          res = requests.get('https://storage.googleapis.com/cdfw-wolf-tracker/wolf_bins.geojson')
          data = res.json()
          kml = simplekml.Kml()

          for feature in data.get('features', []):
              props = feature.get('properties', {})
              geom = feature.get('geometry', {})

              if not geom or geom.get('type') != 'Polygon':
                  continue

              # Robustly handle missing or null keys
              name = props.get('name') or props.get('Name') or 'Unknown Polygon'
              pack_origin = props.get('pack_origin') or props.get('Pack_Origin') or 'Unknown Origin'
              date_updated = props.get('most_recent_adj') or props.get('Most_Recent_Adj') or 'N/A'
              
              raw_tod = props.get('time_of_day') or props.get('Time_Of_Day') or ''
              tod_clean = str(raw_tod).strip().lower()

              # Append time of day to the title so CalTopo doesn't overwrite duplicate names
              display_name = f"{name} ({raw_tod})" if raw_tod else name

              # Format description block
              description_text = (
                  f"Name: {name}\n"
                  f"Pack Origin: {pack_origin}\n"
                  f"Most Recent Adj: {date_updated}\n"
                  f"Time of Day: {raw_tod}"
              )

              coords = [tuple(coord) for coord in geom['coordinates'][0]]
              poly = kml.newpolygon(
                  name=display_name,
                  description=description_text,
                  outerboundaryis=coords
              )

              # Define standard web hex colors for CalTopo's ExtendedData
              ct_green = '#00aa00'
              ct_purple = '#aa00aa'
              
              # Defaults
              stroke_color = ct_green
              fill_color = ct_green
              stroke_width = '2'

              # Standard KML Fallback Colors (AABBGGRR)
              kml_green_fill = '4D00AA00'
              kml_green_line = 'FF00AA00'
              kml_purple_fill = '4DAA00AA'
              kml_purple_line = 'FFAA00AA'

              if tod_clean == 'day':
                  stroke_color = ct_green
                  fill_color = ct_green
                  poly.style.polystyle.color = kml_green_fill
                  poly.style.linestyle.color = kml_green_line
              elif tod_clean == 'night':
                  stroke_color = ct_purple
                  fill_color = ct_purple
                  poly.style.polystyle.color = kml_purple_fill
                  poly.style.linestyle.color = kml_purple_line
              elif tod_clean == 'both':
                  stroke_color = ct_purple   # Purple border
                  fill_color = ct_green      # Green fill
                  stroke_width = '3'
                  poly.style.polystyle.color = kml_green_fill
                  poly.style.linestyle.color = kml_purple_line

              poly.style.linestyle.width = int(stroke_width)

              # INJECT CALTOPO-SPECIFIC STYLING 
              # CalTopo natively reads these ExtendedData attributes over standard KML styles
              poly.extendeddata.newdata('stroke', stroke_color)
              poly.extendeddata.newdata('fill', fill_color)
              poly.extendeddata.newdata('fill-opacity', '0.3')
              poly.extendeddata.newdata('stroke-width', stroke_width)
              poly.extendeddata.newdata('stroke-opacity', '1.0')

          os.makedirs('kmls', exist_ok=True)
          kml.save('w_live.kml')
          kml.save(os.path.join('kmls', datetime.datetime.now().strftime('%m-%d-%Y_%H-%M-%S') + '.kml'))
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add w_live.kml kmls/
          git commit -m "Automated update of wolf tracking data" || exit 0
          git push
