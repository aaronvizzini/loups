name: Sync GeoJSON to KML

on:
  schedule:
    - cron: '0 15,22 * * *'
  workflow_dispatch: # Allows you to manually trigger it anytime

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install simplekml requests

      - name: Run Data Conversion
        run: |
          python - << 'EOF'
          import requests
          import simplekml
          import json
          import datetime
          import os

          # Fetch the raw CDFW data
          res = requests.get('https://storage.googleapis.com/cdfw-wolf-tracker/wolf_bins.geojson')
          data = res.json()

          kml = simplekml.Kml()

          for feature in data['features']:
              props = feature['properties']
              geom = feature['geometry']
              
              if geom['type'] == 'Polygon':
                  # Format properties for CalTopo
                  name = props.get('name', 'Unknown Wolf')
                  pack_origin = props.get('pack_origin', 'Unknown Origin')
                  date_updated = props.get('most_recent_adj', 'N/A')
                  time_of_day = props.get('time_of_day', 'N/A')
                  
                  # Detailed description tag
                  desc = (
                      f"Name: {name}\n"
                      f"Pack Origin: {pack_origin}\n"
                      f"Most Recent Adj: {date_updated}\n"
                      f"Time of Day: {time_of_day}"
                  )
                  
                  # Append time_of_day to label so CalTopo treats Day and Night entries as separate features
                  label_name = f"{name} ({time_of_day})"

                  # Create polygon in KML
                  coords = [tuple(coord) for coord in geom['coordinates'][0]]
                  poly = kml.newpolygon(name=label_name, description=desc, outerboundaryis=coords)
                  
                  # Styling (KML AABBGGRR hex format)
                  # Green: fill '3300a000', border 'ff00a000'
                  # Purple: fill '33a000a0', border 'ffa000a0'
                  if time_of_day == 'day':
                      poly.style.polystyle.color = '3300a000' # Green fill
                      poly.style.linestyle.color = 'ff00a000' # Green border
                      poly.style.linestyle.width = 3
                  elif time_of_day == 'night':
                      poly.style.polystyle.color = '33a000a0' # Purple fill
                      poly.style.linestyle.color = 'ffa000a0' # Purple border
                      poly.style.linestyle.width = 3
                  elif time_of_day == 'both':
                      poly.style.polystyle.color = '3300a000' # Green fill
                      poly.style.linestyle.color = 'ffa000a0' # Purple border
                      poly.style.linestyle.width = 3

          os.makedirs('kmls', exist_ok=True)
          kml.save('w_live.kml')
          kml.save(os.path.join('kmls', datetime.datetime.now().strftime('%m-%d-%Y_%H-%M-%S') + '.kml'))
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add w_live.kml kmls/
          git commit -m "Automated update of wolf tracking data" || exit 0
          git push
